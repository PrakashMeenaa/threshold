[project]
name = "threshold-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prakash Meena", email = "meenaprak12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
threshold-api = "threshold_api:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
